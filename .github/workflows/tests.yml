name: Pruebas
on:
  pull_request:
  workflow_dispatch:
  # Lo llama pages.yml antes de publicar (así en main las pruebas corren una sola vez).
  workflow_call:
permissions:
  contents: read
concurrency:
  group: pruebas-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Verificar entrada actual de Tinta
        run: python tools/sync-tinta-entry.py --check
      - name: Python para generar la versión autónoma
        uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - name: Sintaxis de los JavaScript
        run: for f in web/js/*.js web/sw.js; do node --check "$f" || exit 1; done
      - name: Instalar Playwright y Chromium
        working-directory: tests
        run: |
          npm ci --no-audit --no-fund
          # Si el espejo de apt falla por red (DNS), se reintenta en vez de perder el despliegue.
          for i in 1 2 3; do
            sudo sed -i 's#http://azure.archive.ubuntu.com#http://archive.ubuntu.com#g' /etc/apt/sources.list /etc/apt/sources.list.d/* 2>/dev/null || true
            sudo apt-get update -o Acquire::Retries=3 || true
            timeout 240 npx playwright install --with-deps chromium && exit 0
            echo "Intento $i fallido; reintentando en 20 s"; sleep 20
          done
          exit 1
      - name: Pruebas de extremo a extremo
        working-directory: tests
        run: npm test  # run-all.cjs: las 22 pruebas con servidor propio
