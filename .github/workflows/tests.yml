name: Pruebas
on:
  pull_request:
  workflow_dispatch:
  # Lo llama pages.yml antes de publicar (así en main las pruebas corren una sola vez).
  workflow_call:
permissions:
  contents: read
concurrency:
  group: pruebas-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Verificar entrada actual de Tinta
        run: python tools/sync-tinta-entry.py --check
      - name: Python para generar la versión autónoma
        uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - name: Sintaxis de los JavaScript
        run: for f in web/js/*.js web/sw.js; do node --check "$f" || exit 1; done
      - name: Instalar Playwright y Chromium
        timeout-minutes: 10
        working-directory: tests
        run: |
          npm ci --no-audit --no-fund
          # Sin apt: la imagen de GitHub ya trae las librerías del navegador (incluye Chrome).
          # Antes, --with-deps dependía del espejo de Ubuntu y fallaba o se colgaba por DNS.
          npx playwright install chromium
          if node -e "require('playwright').chromium.launch().then(b=>b.close())"; then exit 0; fi
          echo "Chromium no arranca sin dependencias; se intentan con apt (máx. 5 min)"
          timeout 300 npx playwright install-deps chromium
          node -e "require('playwright').chromium.launch().then(b=>b.close())"
      - name: Pruebas de extremo a extremo
        working-directory: tests
        run: npm test  # run-all.cjs: las 22 pruebas con servidor propio
