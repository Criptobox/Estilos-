<!DOCTYPE html>
<html lang="es"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="color-scheme" content="light">
<title>Estilos · Biblioteca de diseño UI</title>
<meta name="theme-color" content="#17779e">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<link rel="stylesheet" href="css/styles.css">
</head>
<body>
<div id="app"><main id="view" aria-live="polite"></main></div>
<nav id="nav" aria-label="Navegación principal"></nav>
<div id="actbar" class="actbar" style="display:none"></div>
<div id="sheetWrap" class="sheetWrap" style="display:none" role="dialog" aria-modal="true"><div class="sheetCard" id="sheetCard"></div></div>
<div id="lightbox" style="display:none" data-act="closelb" role="dialog" aria-label="Imagen de referencia"><img id="lbImg" src="" alt=""><div id="lbCap" style="font-size:13px;font-weight:600"></div></div>
<script src="js/util.js"></script>
<script src="js/icons.js"></script>
<script src="js/designs-core.js"></script>
<script src="js/designs-a.js"></script>
<script src="js/designs-b.js"></script>
<script src="js/designs-c.js"></script>
<script src="js/designs-d.js"></script>
<script src="js/data.js"></script>
<script src="js/app.js"></script>
<script>
if ("serviceWorker" in navigator && location.protocol !== "file:") {
  const had = !!navigator.serviceWorker.controller; let reloaded = false;
  navigator.serviceWorker.addEventListener("controllerchange", () => { if (had && !reloaded) { reloaded = true; location.reload(); } });
  addEventListener("load", () => navigator.serviceWorker.register("sw.js").then(r => {
    const check = () => r.update().catch(() => {});
    document.addEventListener("visibilitychange", () => { if (!document.hidden) check(); });
    setInterval(check, 30 * 60 * 1000);
  }).catch(() => {}));
}
</script>
</body></html>
